server {
  listen 80;
  server_name mysyte.com
  index index.php;
  root /var/www;

  location ~ (\.php|/)$ {
    include /etc/nginx/fastcgi_params;
    fastcgi_pass php:9000;
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
  }

  location * { 
    try_files $uri $uri/ =404;
  } 
}