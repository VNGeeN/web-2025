<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Профиль</title>
    <link rel="stylesheet" href="../css/fonts.css" />
    <link rel="stylesheet" href="../css/profile.css">
  </head>
  <body>
    <div class="main-container">
      <aside class="side-bar">
        <ul class="menu">
          <li class="menu__list">
            <a href="#" class="menu__link">
              <img
                class="menu__icon"
                src="../../assets/icons/home-icon.svg"
                alt="Домашняя страница"
              />
            </a>
          </li>
          <li class="menu__list">
            <a href="#" class="menu__link">
              <img
                class="menu__icon"
                src="../../assets/icons/profile-icon.svg"
                alt="Страница пользователя"
              />
            </a>
          </li>
          <li class="menu__list">
            <a href="#" class="menu__link">
              <img
                class="menu__icon"
                src="../../assets/icons/plus-icon.svg"
                alt="Новый пост"
              />
            </a>
          </li>
        </ul>
      </aside>
      <div class="container">
        <div class="profile">
          <div class="profile__head">
            <div class="profile__author-info">
              <img
                class="profile__avatar"
                src="../../assets/vanya-denisof-profile-avatar.png"
                alt="Фото аватара в профиле"
              />
              <span class="profile__name">Ваня Денисов</span>
              <span class="profile__descriprion">
                Привет! Я системный аналитик в АСМЕ :) Тут моя жизнь только для
                самых класных!
              </span>
            </div>
            <div class="profile__info">
              <img
                class="profile__image-icon"
                src="../../assets/icons/image-icon.svg"
                alt="Иконка картинок"
              />
              <span class="profile__count-posts">43</span>
              <span class="profile__post-info-text">поста</span>
            </div>
          </div>
          <div class="profile__mosaic">
            <img class="profile__mosaic-img" src="../../assets/Frame-22.png" alt="Фото в истории №1" />
            <img class="profile__mosaic-img" src="../../assets/Frame-23.png" alt="Фото в истории №2" />
            <img class="profile__mosaic-img" src="../../assets/Frame-24.png" alt="Фото в истории №3" />
            <img class="profile__mosaic-img" src="../../assets/Frame-25.png" alt="Фото в истории №4" />
            <img class="profile__mosaic-img" src="../../assets/Frame-26.png" alt="Фото в истории №5" />
            <img class="profile__mosaic-img" src="../../assets/Frame-27.png" alt="Фото в истории №6" />
            <img class="profile__mosaic-img" src="../../assets/Frame-28.png" alt="Фото в истории №7" />
            <img class="profile__mosaic-img" src="../../assets/Frame-30.png" alt="Фото в истории №8" />
            <img class="profile__mosaic-img" src="../../assets/Frame-32.png" alt="Фото в истории №9" />
            <img class="profile__mosaic-img" src="../../assets/Frame-29.png" alt="Фото в истории №10" />
            <img class="profile__mosaic-img" src="../../assets/Frame-34.png" alt="Фото в истории №11" />
            <img class="profile__mosaic-img" src="../../assets/Frame-31.png" alt="Фото в истории №12" />
            <img class="profile__mosaic-img" src="../../assets/Frame-35.png" alt="Фото в истории №13" />
            <img class="profile__mosaic-img" src="../../assets/Frame-33.png" alt="Фото в истории №14" />
            <img class="profile__mosaic-img" src="../../assets/Frame-36.png" alt="Фото в истории №15" />
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
