<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Авторизация</title>
    <link rel="stylesheet" href="../css/fonts.css" />
    <link rel="stylesheet" href="../css/auth.css" />
  </head>
  <body>
    <main class="main">
      <div class="auth">
        <div class="auth__face">
          <p class="auth__face-text">Войти</p>
          <img
            class="auth__face-pic"
            src="../../assets/login.png"
            alt="Улыбающийся турист на поле"
          />
        </div>
        <form class="auth__form" method="post">
          <div class="auth__form-field">
            <label class="auth__form-field-lable" for="email">Электропочта</label>
            <div class="auth__form-field-input-box">
              <input
                id="email"
                class="auth__form-field-input"
                type="email"
                name="email"
                required
              />
            </div>
            <div class="auth__form-field-message">
              Введите электропочту в формате *****@***.**
            </div>
          </div>
          <div class="auth__form-field auth__form-field_last">
            <label class="auth__form-field-lable" for="password"> Пароль </label>
            <div class="auth__form-field-input-box">
              <input
                id="password"
                class="auth__form-field-input"
                type="password"
                name="password"
                required
              />
              <button
                id="eye-button"
                type="button"
                class="auth__form-field-eye-button"
              ></button>
            </div>
          </div>
          <button type="submit" class="auth__form-field-submit">Продолжить</button>
        </form>
      </div>
    </main>
    <script src="../js/auth.js"></script>
  </body>
</html>
