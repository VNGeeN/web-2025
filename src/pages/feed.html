<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Лента</title>
    <link rel="stylesheet" href="../css/fonts.css" />
    <link rel="stylesheet" href="../css/feed.css">
  </head>
  <body>
    <div class="main-container">
      <aside class="side-bar">
        <ul class="menu">
          <li class="menu__list">
            <a href="#" class="menu__link">
              <img
                class="menu__icon"
                src="../../assets/icons/home-icon.svg"
                alt="Домашняя страница"
              />
            </a>
          </li>
          <li class="menu__list">
            <a href="#" class="menu__link">
              <img
                class="menu__icon"
                src="../../assets/icons/profile-icon.svg"
                alt="Страница пользователя"
              />
            </a>
          </li>
          <li class="menu__list">
            <a href="#" class="menu__link">
              <img
                class="menu__icon"
                src="../../assets/icons/plus-icon.svg"
                alt="Новый пост"
              />
            </a>
          </li>
        </ul>
      </aside>
      <div class="container">
        <div class="card">
          <div class="card__head">
            <div class="card__author-info">
              <img
                class="card__avatar"
                src="../../assets/vanya-denisov-avatar.png"
                alt="Картинка аватара"
              />
              <span class="card__name">Ваня Денисов</span>
            </div>
            <div class="card__redactor-button">
              <img
                class="card__button-icon"
                src="../../assets/icons/redactor-icon.svg"
                alt="Картинка редактирования"
              />
            </div>
          </div>
          <div class="card__media">
            <img
              class="card__image"
              src="../../assets/Photo-1.png"
              alt="Фото в ленте"
            />
            <div class="card__note">1/3</div>
          </div>
          <div class="card__reaction">
            <div class="card__like">
              <img
                class="card__reaction-icon"
                src="../../assets/icons/like-icon.png"
                alt=""
              />
              <span class="card__reaction-count">203</span>
            </div>
          </div>
          <div class="card__description">
            <p class="card__text">
              Так красиво сегодня на улице! Настоящая зима)) Вспоминается
              Бродский: «Поздно ночью, в уснувшей долине, на самом дне, в
              городке, занесенном снегом по ручку двери...»
            </p>
            <button class="card__button-more">ещё</button>
          </div>
          <div class="card__post-time">2 часа назад</div>
        </div>
        <div class="card">
          <div class="card__head">
            <div class="card__author-info">
              <img
                class="card__avatar"
                src="../../assets/liza-demina-avatar.png"
                alt="Картинка аватара"
              />
              <span class="card__name">Лиза Дёмина</span>
            </div>
            <div class="card__redactor-button">
              <img
                class="card__button-icon"
                src="../../assets/icons/redactor-icon.svg"
                alt="Картинка редактирования"
              />
            </div>
          </div>
          <div class="card__media">
            <img
              class="card__image"
              src="../../assets/Photo-2.png"
              alt="Фото в ленте"
            />
            <div class="card__note"></div>
          </div>
          <div class="card__reaction">
            <div class="card__like">
              <img
                class="card__reaction-icon"
                src="../../assets/icons/like-icon.png"
                alt=""
              />
              <span class="card__reaction-count">534</span>
            </div>
          </div>
          <div class="card__post-time">1 день назад</div>
        </div>
      </div>
    </div>
  </body>
</html>
