version: '3'
services:
  nginx:
    build: ./images/nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/mysyte.com.conf:/etc/nginx/conf.d/mysyte.com.conf
      - ./src:/var/www
    environment:
      - MY_VAR=value
    depends_on:
      - php
  php:
    build: ./images/php
    volumes:
      - ./src:/var/www
